<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="./src/output.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Receitas da mimia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
        .input-preenchido {
            background: transparent !important;
            border-color: transparent !important;
        }

    </style>
</head>
<body class="bg-fundo-branco dark:bg-linear-to-br dark:from-marrom dark:to-preto text-preto dark:text-fundo-branco min-h-screen font-lato">

    <div class="bg-marrom border-b border-b-laranja-primary">
        <header class="flex justify-between items-center py-4 max-w-6xl mx-auto px-6 shadow-lg">
            <div class="flex items-center gap-2">
                <h1 class="text-fundo-branco hidden md:flex md:text-4xl font-fran md:items-center">Receitas da Mimia</h1>
                <img src="img/chef-hat.svg" height="40" width="40" alt="">
            </div>
            <div class="flex items-center gap-4">
                <button id="nova-receita" class="bg-laranja-primary py-2 px-5 rounded-full text-preto font-semibold flex items-center gap-2 cursor-pointer transition-all duration-200 hover:brightness-110 hover:scale-105">
                    <img src="img/cookie.svg" width="20" height="20" alt="">
                    Nova receita
                </button>
                <button id="btn-dark" class="bg-fundo-branco rounded-full p-1.5 cursor-pointer transition-all duration-300"><img id="icon" height="22" width="22" src="img/sun-duotone.svg" alt=""></button>
            </div>
        </header>
    </div>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div>
            <h1 class="text-4xl md:text-6xl font-fran">Suas receitas, <span class="text-laranja-secundary">do seu jeito</span>.</h1>
            <p class="text-lg md:text-xl text-cinza dark:text-fundo-branco font-light">Adicione, edite e organize suas receitas favoritas.</p>
        </div>

        <!--pesquisar e filtros-->
        <div class="flex flex-wrap items-center justify-between gap-6 py-12">
            <div class="relative w-full md:w-auto">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input placeholder="Buscar receita..." type="search" class="pl-9 pr-4 py-2 rounded-full border border-gray-300 dark:border-cinza bg-white dark:bg-preto text-sm text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200 w-full md:w-64">
            </div>

            <div class="flex gap-4">
                <button class="bg-transparent hover:bg-laranja-primary border-2 border-laranja-primary dark:bg-laranja-primary hover:brightness-110 dark:hover:brightness-110 text-preto cursor-pointer hover:scale-105 transition-all duration-200 py-2 px-6 rounded-full flex items-center gap-2">
                    Todos
                </button>

                <button class="bg-transparent hover:bg-laranja-primary border-2 border-laranja-primary dark:bg-laranja-primary hover:brightness-110 dark:hover:brightness-110 text-preto cursor-pointer hover:scale-105 transition-all duration-200 py-2 px-6 rounded-full flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-soup-icon lucide-soup"><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/>
                        <path d="M7 21h10"/><path d="M19.5 12 22 6"/><path d="M16.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.73 1.62"/>
                        <path d="M11.25 3c.27.1.8.53.74 1.36-.05.83-.93 1.2-.98 2.02-.06.78.33 1.24.72 1.62"/>
                        <path d="M6.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.74 1.62"/>
                    </svg>
                    <span class="hidden md:inline">Salgados</span>
                </button>

                <button class="bg-transparent hover:bg-laranja-primary border-2 border-laranja-primary dark:bg-laranja-primary hover:brightness-110 dark:hover:brightness-110 text-preto cursor-pointer hover:scale-105 transition-all duration-200 py-2 px-6 rounded-full flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dessert-icon lucide-dessert">
                        <path d="M10.162 3.167A10 10 0 0 0 2 13a2 2 0 0 0 4 0v-1a2 2 0 0 1 4 0v4a2 2 0 0 0 4 0v-4a2 2 0 0 1 4 0v1a2 2 0 0 0 4-.006 10 10 0 0 0-8.161-9.826"/>
                        <path d="M20.804 14.869a9 9 0 0 1-17.608 0"/><circle cx="12" cy="4" r="2"/>
                    </svg>
                    <span class="hidden md:inline">Doces</span>
                </button>

            </div>

            <span class="qtd-receitas text-sm text-gray-400 dark:text-gray-200"></span>

        </div>

        <!--cards-->
        <section class="grid grid-cols-1 gap-5 md:grid-cols-3"></section>
    </main>

    <!--modal formulário-->
    <div id="form-modal" class="hidden fixed inset-0 bg-preto/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-marrom rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">

            <h2 class="text-2xl font-fran  mb-6 bg-marrom text-fundo-branco px-4 py-2 rounded-full shadow-md">Nova receita</h2>

            <div class="grid grid-cols-[1fr_80px] gap-5">
                <div class="mb-6">
                    <label class="block text-md text-preto/70 dark:text-fundo-branco mb-1 font-fran font-semibold"
                           for="nome-receita">Nome da receita</label>
                    <input class="w-full px-4 py-2 rounded-full border-2 border-preto/10 dark:border-fundo-branco/20 bg-fundo-branco dark:bg-fundo-branco/10 text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200"
                           type="text" name="nome-receita" id="nome-receita" placeholder="Ex:Bolo de cenoura">
                    <p id="erro-nome" class="hidden text-[#CC3F3A] text-sm mt-1">Por favor, insira o nome da receita.</p>
                </div>

                <div class="mb-6">
                    <label class="block text-md text-preto/70 dark:text-fundo-branco mb-1 font-fran font-semibold"
                           for="emoji">Emoji</label>
                    <input class="w-full px-4 py-2 rounded-full border-2 border-preto/10 dark:border-fundo-branco/20 bg-fundo-branco dark:bg-fundo-branco/10 text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200"
                           type="text" name="emoji" id="emoji">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-md text-preto/70 dark:text-fundo-branco mb-1 font-fran font-semibold" for="tipo-receita">Tipo</label>
                <select class="w-full px-4 py-2 rounded-full border-2 border-preto/10 dark:border-fundo-branco/20 bg-fundo-branco dark:bg-fundo-branco/10 text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200" name="tipo-receita" id="tipo-receita">
                    <option value="salgado">Salgado</option>
                    <option value="doce">Doce</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-5 border-b-2 border-b-marrom/20">
                <div class="mb-6">
                    <label class="block text-md text-preto/70 dark:text-fundo-branco mb-1 font-fran font-semibold"
                           for="tempo-receita">Tempo de preparo</label>
                    <input class="w-full px-4 py-2 rounded-full border-2 border-preto/10 dark:border-fundo-branco/20 bg-fundo-branco dark:bg-fundo-branco/10 text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200"
                           type="text" name="tempo-receita" id="tempo-receita" placeholder="Ex:30 min">
                </div>

                <div class="mb-6">
                    <label class="block text-md text-preto/70 dark:text-fundo-branco mb-1 font-fran font-semibold"
                           for="qtd-pessoas">Qtd de pessoas</label>
                    <input class="w-full px-4 py-2 rounded-full border-2 border-preto/10 dark:border-fundo-branco/20 bg-fundo-branco dark:bg-fundo-branco/10 text-preto dark:text-fundo-branco outline-none focus:border-laranja-primary transition-all duration-200"
                           type="text" name="qtd-pessoas" id="qtd-pessoas">
                </div>
            </div>

            <div class="mt-6 border-b-2 border-b-marrom/20 pb-6">
                <h3 class="text-xl font-fran">Ingredientes</h3>
                <ul id="lista-ingredientes" class="space-y-3">
                </ul>
                <button id="btn-input" class="group flex gap-1 items-center w-full border-2 border-dotted border-marrom/30 dark:border-fundo-branco/40 hover:border-laranja-primary text-marrom/50 dark:text-fundo-branco hover:text-laranja-primary cursor-pointer justify-center p-1 mt-4 rounded-full" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" class="fill-marrom/50 dark:fill-fundo-branco group-hover:fill-laranja-primary" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z"></path>
                    </svg>
                    Adicionar ingrediente
                </button>
            </div>

            <div class="mt-6">
                <h3 class="text-xl font-fran">Modo de preparo</h3>
                <ul id="lista-preparo"></ul>
                <button id="btn-preparo" class="group flex gap-1 items-center w-full border-2 border-dotted border-marrom/30 dark:border-fundo-branco/40 hover:border-laranja-primary text-marrom/50 dark:text-fundo-branco hover:text-laranja-primary cursor-pointer justify-center p-1 mt-4 rounded-full" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" class="fill-marrom/50 dark:fill-fundo-branco group-hover:fill-laranja-primary" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H136v32a8,8,0,0,1-16,0V136H88a8,8,0,0,1,0-16h32V88a8,8,0,0,1,16,0v32h32A8,8,0,0,1,176,128Z"></path>
                    </svg>
                    Adicionar etapa
                </button>
            </div>

            <div class="mt-8 flex gap-4 justify-end">
                <button id="btn-cancelar" class="border-2 border-marrom/70 text-preto/70 hover:border-marrom hover:text-fundo-branco hover:bg-marrom dark:border-fundo-branco/40 dark:text-fundo-branco px-6 py-2 rounded-full cursor-pointer transition-all duration-300">Cancelar</button>
                <button id="btn-salvar" class="bg-laranja-primary dark:text-preto px-6 py-2 rounded-full font-semibold border-2 border-marrom hover:brightness-110  cursor-pointer transition-all duration-300">Salvar</button>
            </div>

        </div>
    </div>
</body>
</html>
